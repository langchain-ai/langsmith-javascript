name: Publish NPM
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # Build runs third-party code (pnpm install, the build scripts, Socket) and
  # must never hold the OIDC token. Only the publish job can mint it, and it
  # runs nothing but the upload of the packed tarball.
  build:
    if: github.repository == 'langchain-ai/langsmith-javascript' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Expected a stable vX.Y.Z or release-candidate tag" >&2
            exit 1
          fi
          PRERELEASE=false
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            PRERELEASE=true
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq "select(.isDraft == false and .isPrerelease == $PRERELEASE)" | grep -q .

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Protect dependency downloads
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Check the package version matches the release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) throw new Error("Release and package versions differ")'

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          ./scripts/build

      - name: Check npm version
        run: |
          PUBLISHED_VERSION=$(npm view langsmith version)
          PACKAGE_VERSION=$(node -p 'require("./package.json").version')
          PUBLISHED_VERSION="$PUBLISHED_VERSION" PACKAGE_VERSION="$PACKAGE_VERSION" node -e '
            const semver = require("semver");
            if (!semver.gt(process.env.PACKAGE_VERSION, process.env.PUBLISHED_VERSION)) {
              throw new Error(`Package version ${process.env.PACKAGE_VERSION} must be newer than npm latest ${process.env.PUBLISHED_VERSION}`);
            }
          '

      - name: Pack the package
        working-directory: dist
        run: |
          mkdir -p ../package
          npm pack --pack-destination ../package

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package/

      - name: Publish through npm trusted publishing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TARBALLS=(./package/*.tgz)
          if [ "${#TARBALLS[@]}" -ne 1 ] || [ ! -f "${TARBALLS[0]}" ]; then
            echo "Expected exactly one tarball, got: ${TARBALLS[*]}" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            npm publish "${TARBALLS[0]}" --access public --tag next
          else
            npm publish "${TARBALLS[0]}" --access public
          fi

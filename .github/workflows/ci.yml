name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'
  schedule:
    # Nightly: every job, every environment, Slack on failure.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      integration-environment:
        description: LangSmith environment for the integration suite
        type: choice
        default: beta
        options: [beta, v16-ch-only, v16-dual, v16-smithdb-only, all]
      exit-first:
        description: Stop at the first failing test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Test mirror formatting
        run: .github/scripts/test-format-mirror.sh

      - name: Check types
        run: ./scripts/lint

  test:
    timeout-minutes: 20
    name: 'test (${{ matrix.os }}, node ${{ matrix.node-version }})'
    runs-on: ${{ matrix.os }}
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    defaults:
      run:
        shell: bash # scripts/* are bash; windows defaults to pwsh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['22', '24']
        include:
          - os: windows-latest
            node-version: '24'
          - os: macos-latest
            node-version: '24'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        # The Stainless `prepare` hook is a bash one-liner; pnpm runs hooks via cmd.exe on windows.
        run: ./scripts/bootstrap ${{ runner.os == 'Windows' && '--ignore-scripts' || '' }}

      # Same as langsmith-sdk's `js-test` job: jest unit tests (integration tests need API keys), then vitest.
      - name: Run tests
        run: ./scripts/test

      - name: Run vitest tests
        run: pnpm test:vitest

  build:
    timeout-minutes: 5
    name: build
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check build
        run: ./scripts/build

  # Built package installed from dist into a clean container per consumer:
  # one per bundler plus deepagents, like langsmith-sdk's js-exports-* and
  # js-deepagent-compat jobs.
  exports:
    timeout-minutes: 15
    name: 'exports (${{ matrix.target }})'
    runs-on: ubuntu-latest
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    strategy:
      fail-fast: false
      matrix:
        target: [esm, cjs, cf, vite, webpack, esbuild, metro, deepagent-compat]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Build
        run: ./scripts/build

      - name: Test exports
        run: docker compose -f internal/environment_tests/docker-compose.yml run ${{ matrix.target == 'deepagent-compat' && 'test-deepagent-compat' || format('test-exports-{0}', matrix.target) }}

  # Live suite against a LangSmith deployment: main pushes hit beta, the
  # nightly hits every environment, a dispatch picks one.
  integration-matrix:
    name: 'integration matrix'
    runs-on: ubuntu-latest
    # Staging only: the prod repo has no API-key secrets and receives promoted code.
    if: github.repository == 'langchain-ai/langsmith-javascript-staging' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          SELECTED: ${{ github.event_name == 'schedule' && 'all' || github.event.inputs.integration-environment || 'beta' }}
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          ENDPOINTS = {
              "beta": "https://beta.api.smith.langchain.com",
              "v16-ch-only": "https://aks.smith.langchain.dev/api",
              "v16-dual": "https://stable-dual.eks.smith.langchain.dev/api",
              "v16-smithdb-only": "https://stable-smithdb.eks.smith.langchain.dev/api",
          }
          # SmithDB-only lacks the legacy ClickHouse endpoints, ClickHouse-only lacks v2,
          # only the beta tenant resolves the shared dataset token, and the provider
          # wrapper tests (mocked LangSmith client) run once, on beta.
          EXCLUDED = {"v16-ch-only": ["require_v2"], "v16-smithdb-only": ["require_clickhouse"]}
          selected = os.environ["SELECTED"]
          envs = list(ENDPOINTS) if selected == "all" else [selected if selected in ENDPOINTS else "beta"]
          include = []
          for env in envs:
              markers = EXCLUDED.get(env, []) + ([] if env == "beta" else ["require_beta_dataset", "require_provider"])
              include.append({
                  "environment": env,
                  "endpoint": ENDPOINTS[env],
                  "suffix": "" if env == "beta" else f" [{env}]",
                  "exclude_markers": ",".join(markers),
              })
          print("matrix=" + json.dumps({"include": include}))
          EOF

  integration:
    name: 'integration${{ matrix.suffix }}'
    needs: integration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    env:
      LANGSMITH_TRACING_V2: 'true'
      LANGSMITH_ENDPOINT: ${{ matrix.endpoint }}
      LANGSMITH_API_KEY: >-
        ${{ (matrix.environment == 'v16-ch-only' && secrets.LANGSMITH_API_KEY_AKS_V15)
         || (matrix.environment == 'v16-dual' && secrets.LANGSMITH_API_KEY_STABLE_DUAL)
         || (matrix.environment == 'v16-smithdb-only' && secrets.LANGSMITH_API_KEY_STABLE_SMITHDB)
         || secrets.LANGSMITH_API_KEY_BETA }}
      LANGSMITH_TEST_EXCLUDE_MARKERS: ${{ matrix.exclude_markers }}
      # Provider calls go through the prod LLM Gateway: its workspace holds all
      # three provider secrets. The LangSmith deployment under test is separate.
      OPENAI_BASE_URL: https://gateway.smith.langchain.com/openai/v1
      ANTHROPIC_BASE_URL: https://gateway.smith.langchain.com/anthropic
      GOOGLE_GEMINI_BASE_URL: https://gateway.smith.langchain.com/gemini
      OPENAI_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      ANTHROPIC_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      GEMINI_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      GOOGLE_API_KEY: ${{ secrets.LANGSMITH_API_KEY_PROD }}
      # Main pushes stop at the first failure; nightly and dispatch report them all.
      JEST_BAIL: ${{ (github.event_name == 'push' || github.event.inputs.exit-first == 'true') && '--bail' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check credentials
        run: '[ -n "$LANGSMITH_API_KEY" ] || { echo "::error::No API key secret for ${{ matrix.environment }}"; exit 1; }'

      - name: Run integration tests
        run: pnpm test:integration $JEST_BAIL

  vitest-eval:
    name: 'vitest eval${{ matrix.suffix }}'
    needs: integration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.integration-matrix.outputs.matrix) }}
    env:
      LANGSMITH_TRACING_V2: 'true'
      LANGSMITH_ENDPOINT: ${{ matrix.endpoint }}
      LANGSMITH_API_KEY: >-
        ${{ (matrix.environment == 'v16-ch-only' && secrets.LANGSMITH_API_KEY_AKS_V15)
         || (matrix.environment == 'v16-dual' && secrets.LANGSMITH_API_KEY_STABLE_DUAL)
         || (matrix.environment == 'v16-smithdb-only' && secrets.LANGSMITH_API_KEY_STABLE_SMITHDB)
         || secrets.LANGSMITH_API_KEY_BETA }}
      VITEST_BAIL: ${{ (github.event_name == 'push' || github.event.inputs.exit-first == 'true') && '--bail=1' || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: '10.30.1'

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Check credentials
        run: '[ -n "$LANGSMITH_API_KEY" ] || { echo "::error::No API key secret for ${{ matrix.environment }}"; exit 1; }'

      - name: Run vitest eval runner
        run: pnpm test:eval:vitest $VITEST_BAIL

  bun-test:
    name: 'bun integration'
    needs: integration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANGSMITH_TRACING: 'true'
      LANGSMITH_ENDPOINT: https://beta.api.smith.langchain.com
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY_BETA }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Bun tests
        run: bun test ./src/lib/tests/bun/traceable.test.bun.ts

  ci-success:
    name: 'CI Success'
    needs: [lint, test, build, exports, integration-matrix, integration, vitest-eval, bun-test]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULTS_JSON: ${{ toJSON(needs.*.result) }}
    steps:
      - run: |
          echo "$RESULTS_JSON"
          if echo "$RESULTS_JSON" | grep -qE '"(failure|cancelled)"'; then
            echo "CI failed"; exit 1
          fi

  # Only the nightly posts: push and PR failures are visible to whoever pushed.
  notify-slack-on-failure:
    name: 'Notify Slack on nightly failure'
    needs: [ci-success]
    if: ${{ always() && github.repository == 'langchain-ai/langsmith-javascript-staging' && github.event_name == 'schedule' && needs.ci-success.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.INGESTION_CI_BOT_TOKEN }}
          errors: true
          payload: |
            channel: ${{ toJSON(secrets.INGESTION_TEAM_SLACK_CHANNEL_ID) }}
            text: |
              *Nightly langsmith-javascript-staging CI failed*
              *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              *Environments:* beta, v16-ch-only, v16-dual, v16-smithdb-only
